<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة التسجيل</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #202124;
    }

    .container {
        max-width: 650px;
        margin: 30px auto;
        padding: 15px;
    }

    .header {
        background: white;
        border-radius: 10px;
        padding: 25px;
        border-top: 8px solid #673ab7;
        box-shadow: 0 2px 8px #ddd;
        margin-bottom: 15px;
    }

    .header h1 {
        margin-top: 0;
        font-size: 28px;
    }

    .question {
        background: white;
        padding: 22px;
        margin-bottom: 12px;
        border-radius: 10px;
        box-shadow: 0 1px 5px #ddd;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
    }

    input, textarea, select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        border: 1px solid #aaa;
        border-radius: 5px;
        font-size: 16px;
        outline: none;
    }

    input:focus, textarea:focus, select:focus {
        border: 2px solid #673ab7;
    }

    textarea {
        min-height: 110px;
        resize: vertical;
    }

    .options label {
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        cursor: pointer;
    }

    .options input {
        width: auto;
    }

    button {
        width: 100%;
        padding: 15px;
        background: #673ab7;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #512da8;
    }

    .required {
        color: red;
    }

    #success {
        display: none;
        background: #e8f5e9;
        color: #2e7d32;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        margin-top: 15px;
        font-size: 18px;
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>استمارة التسجيل</h1>
        <p>يرجى ملء المعلومات التالية لإتمام التسجيل.</p>
        <small><span class="required">*</span> السؤال مطلوب</small>
    </div>

    <form id="registrationForm">

        <!-- الاسم -->
        <div class="question">
            <label>
                الاسم الثلاثي بالعربي
                <span class="required">*</span>
            </label>
            <input 
                type="text" 
                name="full_name"
                placeholder="اكتب اسمك الثلاثي بالعربي"
                required>
        </div>

        <!-- العمر -->
        <div class="question">
            <label>
                العمر
                <span class="required">*</span>
            </label>
            <input 
                type="number" 
                name="age"
                placeholder="اكتب عمرك"
                min="1"
                required>
        </div>

        <!-- تيليجرام -->
        <div class="question">
            <label>
                معرف التيجرام
                <span class="required">*</span>
            </label>
            <input 
                type="text" 
                name="telegram"
                placeholder="@username"
                required>
        </div>

        <!-- واتساب -->
        <div class="question">
            <label>
                رقم حساب واتساب
                <span class="required">*</span>
            </label>
            <input 
                type="tel" 
                name="whatsapp"
                placeholder="07xxxxxxxxx"
                required>
        </div>

        <!-- مصدر الورشة -->
        <div class="question">
            <label>
                من أين سمعت عن الورشة
                <span class="required">*</span>
            </label>

            <select name="source" required>
                <option value="">اختر إجابة</option>
                <option>التليجرام</option>
                <option>الواتساب</option>
                <option>الإنستغرام</option>
                <option>صديق أو شخص أعرفه</option>
                <option>من إعلان</option>
                <option>أخرى</option>
            </select>
        </div>

        <!-- سبب الحضور -->
        <div class="question">
            <label>
                لماذا تود الحضور
                <span class="required">*</span>
            </label>

            <textarea 
                name="reason"
                placeholder="اكتب سبب رغبتك بالحضور..."
                required></textarea>
        </div>

        <!-- تأكيد الحضور -->
        <div class="question">
            <label>
                هل انت متاكد من حظورك؟
                <span class="required">*</span>
            </label>

            <div class="options">

                <label>
                    <input 
                        type="radio" 
                        name="attendance" 
                        value="نعم"
                        required>
                    نعم
                </label>

                <label>
                    <input 
                        type="radio" 
                        name="attendance" 
                        value="لا">
                    لا
                </label>

                <label>
                    <input 
                        type="radio" 
                        name="attendance" 
                        value="ربما">
                    ربما
                </label>

            </div>
        </div>

        <button type="submit">
            إرسال
        </button>

    </form>

    <div id="success">
        ✅ تم إرسال الاستمارة بنجاح!
    </div>

</div>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(e) {

    e.preventDefault();

    document.getElementById("registrationForm").style.display = "none";

    document.getElementById("success").style.display = "block";

});
</script>

</body>
</html>
