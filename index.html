<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D World — Interactive Night Castle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020204;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* UI Title Overlay */
    #ui {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff;
      z-index: 10;
      pointer-events: none;
    }
    #ui h1 {
      font-size: 24px;
      letter-spacing: 3px;
      color: #b32424;
      text-shadow: 0 0 10px rgba(179, 36, 36, 0.6);
    }
    #ui p {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
    }
  </style>
  <!-- Three.js Library & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <h1>عالم 3D تفاعلي</h1>
    <p>اسحب بالماوس للتدوير | اسحب بالإصبعين للتقريب والتبعيد</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    // 1. Scene, Camera, Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Atmospheric Fog
    scene.background = new THREE.Color(0x030307);
    scene.fog = new THREE.FogExp2(0x05050a, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 2. Orbit Controls (Mouse & Touch Interaction)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01; // Prevents camera going below ground
    controls.minDistance = 10;
    controls.maxDistance = 60;

    // 3. Lighting
    const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.4);
    scene.add(ambientLight);

    // Moonlight
    const moonLight = new THREE.DirectionalLight(0x7890b0, 1.0);
    moonLight.position.set(20, 40, -20);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 1024;
    moonLight.shadow.mapSize.height = 1024;
    scene.add(moonLight);

    // Castle Door Red Glow
    const redGlow = new THREE.PointLight(0xff1122, 2, 15);
    redGlow.position.set(0, 2, 5);
    scene.add(redGlow);

    // 4. Ground (3D Terrain)
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ 
      color: 0x0f0f14, 
      roughness: 0.4, 
      metalness: 0.1 
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 5. Building 3D Castle Structure
    const castleGroup = new THREE.Group();
    const stoneMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.8 });
    const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x0a0a0d, roughness: 0.5 });
    const windowMaterial = new THREE.MeshBasicMaterial({ color: 0xff3300 });

    // Central Tower
    const mainBuildingGeo = new THREE.BoxGeometry(10, 16, 10);
    const mainBuilding = new THREE.Mesh(mainBuildingGeo, stoneMaterial);
    mainBuilding.position.y = 8;
    mainBuilding.castShadow = true;
    mainBuilding.receiveShadow = true;
    castleGroup.add(mainBuilding);

    // Left and Right Towers
    const createSideTower = (x, z) => {
      const tower = new THREE.Group();
      const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 20, 16), stoneMaterial);
      cylinder.position.y = 10;
      cylinder.castShadow = true;

      const cone = new THREE.Mesh(new THREE.ConeGeometry(3.2, 6, 16), roofMaterial);
      cone.position.y = 23;
      cone.castShadow = true;

      tower.add(cylinder, cone);
      tower.position.set(x, 0, z);
      return tower;
    };

    castleGroup.add(createSideTower(-7, 3));
    castleGroup.add(createSideTower(7, 3));

    // Glowing Window
    const winGeo = new THREE.PlaneGeometry(1, 2);
    const window1 = new THREE.Mesh(winGeo, windowMaterial);
    window1.position.set(-2.5, 11, 5.01);
    const window2 = window1.clone();
    window2.position.set(2.5, 11, 5.01);
    castleGroup.add(window1, window2);

    scene.add(castleGroup);

    // 6. 3D Particle Rain System
    const rainCount = 4000;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);

    for (let i = 0; i < rainCount * 3; i += 3) {
      rainPos[i] = (Math.random() - 0.5) * 60;
      rainPos[i + 1] = Math.random() * 40;
      rainPos[i + 2] = (Math.random() - 0.5) * 60;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({
      color: 0x8899aa,
      size: 0.1,
      transparent: true,
      opacity: 0.7
    });

    const rainParticles = new THREE.Points(rainGeo, rainMat);
    scene.add(rainParticles);

    // 7. Render Loop & Animations
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      // Rain Animation Loop
      const positions = rainGeo.attributes.position.array;
      for (let i = 1; i < rainCount * 3; i += 3) {
        positions[i] -= 30 * delta;
        if (positions[i] < 0) positions[i] = 40;
      }
      rainGeo.attributes.position.needsUpdate = true;

      // Lightning Flash Effect (Random)
      if (Math.random() < 0.005) {
        moonLight.intensity = 3.5;
        setTimeout(() => { moonLight.intensity = 1.0; }, 60);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Responsive Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
