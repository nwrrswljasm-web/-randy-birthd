<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#020509" />

  <title>RANDY — The Frozen Journey</title>

  <!-- ============================================================
       RANDY — THE FROZEN JOURNEY
       PART 1 / 3
       
       Structure:
       01. Document metadata
       02. Global styles
       03. Loading screen
       04. Start screen
       05. Minimal HUD
       06. Mobile controls
       07. Cinematic overlays
       08. Final letter
       09. Settings
       10. Application root
       11. Three.js dependency
       12. Main JavaScript bootstrap
       13. Configuration
       14. Procedural noise
       15. Core renderer / scene / camera
       16. Journey zones
       17. Terrain foundation
       
       PART 2 / 3:
       Forest, river, ruins, castle, interior, lighting,
       snow, player character, footprints.

       PART 3 / 3:
       Audio, input, movement, camera, cinematic director,
       finale, boot sequence and application startup.
       ============================================================ -->
       
  <style>
    /* ============================================================
       01 — GLOBAL RESET
       ============================================================ */

    :root {
      --frost: #dce8f2;
      --frost-soft: #aabbd0;
      --ice: #91b6d4;
      --dark: #020509;
      --dark-blue: #07101a;
      --gold: #d9c79a;
      --danger: #d99;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #000;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      -webkit-user-select: none;
      user-select: none;

      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button,
    select,
    input {
      font: inherit;
    }

    canvas {
      display: block;

      width: 100%;
      height: 100%;

      touch-action: none;
    }

    #app {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }


    /* ============================================================
       02 — LOADING SCREEN
       ============================================================ */

    #loading {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: var(--frost);

      text-align: center;

      background:
        radial-gradient(
          ellipse at 50% 38%,
          rgba(21, 31, 44, 0.96) 0%,
          rgba(5, 8, 13, 0.99) 58%,
          #000 100%
        );

      transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 0%,
          rgba(0, 0, 0, 0.28) 55%,
          rgba(0, 0, 0, 0.72) 100%
        );
    }

    #loadingContent {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;

      width: min(90vw, 600px);
    }

    #loading h1 {
      margin: 0 0 0.35rem;

      font-size: clamp(2rem, 6vw, 3.4rem);

      font-weight: 400;

      letter-spacing: 0.35em;

      text-transform: uppercase;

      text-shadow:
        0 0 15px rgba(180, 210, 255, 0.18),
        0 0 40px rgba(180, 210, 255, 0.16);
    }

    #loading h2 {
      margin: 0;

      color: #7f95ad;

      font-size: clamp(0.65rem, 2vw, 0.95rem);

      font-weight: 300;

      letter-spacing: 0.48em;

      text-transform: uppercase;
    }

    #loadingSubtitle {
      margin-top: 1.5rem;

      color: rgba(190, 208, 226, 0.48);

      font-size: 0.62rem;

      letter-spacing: 0.25em;

      text-transform: uppercase;
    }

    #loadbar {
      position: relative;

      width: min(70vw, 380px);
      height: 2px;

      margin-top: 2.8rem;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.1);
    }

    #loadfill {
      position: absolute;
      inset: 0 auto 0 0;

      width: 0%;

      background:
        linear-gradient(
          90deg,
          #516b88 0%,
          #9db9d3 55%,
          #edf6ff 100%
        );

      box-shadow:
        0 0 14px rgba(180, 215, 245, 0.45);

      transition: width 0.35s ease;
    }

    #loadtext {
      margin-top: 1rem;

      color: #5c6f85;

      font-size: 0.67rem;

      letter-spacing: 0.2em;

      text-transform: uppercase;
    }

    #loaderror {
      display: none;

      max-width: min(80vw, 560px);

      margin-top: 1.5rem;

      color: var(--danger);

      font-family:
        Arial,
        sans-serif;

      font-size: 0.78rem;

      line-height: 1.6;

      text-align: center;
    }


    /* ============================================================
       03 — START OVERLAY
       ============================================================ */

    #startOverlay {
      position: fixed;
      inset: 0;

      z-index: 90;

      display: none;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      padding: 1.5rem;

      color: var(--frost);

      text-align: center;

      background:
        radial-gradient(
          circle at center,
          rgba(8, 15, 24, 0.24),
          rgba(0, 0, 0, 0.58)
        );

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    #startOverlay.visible {
      display: flex;
    }

    #startOverlay .card {
      position: relative;

      width: min(90vw, 520px);

      padding: 2rem 2.4rem;

      border:
        1px solid
        rgba(220, 232, 242, 0.22);

      background:
        linear-gradient(
          180deg,
          rgba(8, 15, 23, 0.72),
          rgba(2, 6, 11, 0.78)
        );

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(160, 190, 220, 0.025);
    }

    #startOverlay .card::before,
    #startOverlay .card::after {
      content: "";

      position: absolute;

      width: 22px;
      height: 22px;

      pointer-events: none;
    }

    #startOverlay .card::before {
      top: -1px;
      left: -1px;

      border-top:
        1px solid
        rgba(220, 232, 242, 0.6);

      border-left:
        1px solid
        rgba(220, 232, 242, 0.6);
    }

    #startOverlay .card::after {
      right: -1px;
      bottom: -1px;

      border-right:
        1px solid
        rgba(220, 232, 242, 0.6);

      border-bottom:
        1px solid
        rgba(220, 232, 242, 0.6);
    }

    #startOverlay h3 {
      margin: 0 0 0.8rem;

      font-size: 1.05rem;

      font-weight: 400;

      letter-spacing: 0.18em;

      text-transform: uppercase;
    }

    #startOverlay p {
      margin: 0.35rem 0;

      color: #9fb0c2;

      font-family:
        Arial,
        sans-serif;

      font-size: 0.75rem;

      line-height: 1.65;
    }

    #startOverlay .warning {
      margin-top: 1rem;

      color: rgba(220, 232, 242, 0.4);

      font-size: 0.62rem;

      letter-spacing: 0.08em;
    }

    #beginBtn {
      position: relative;

      margin-top: 1.5rem;

      padding: 0.75rem 2rem;

      color: var(--frost);

      border:
        1px solid
        rgba(220, 232, 242, 0.45);

      background:
        rgba(220, 232, 242, 0.025);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.72rem;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    }

    #beginBtn:hover {
      background: rgba(220, 232, 242, 0.1);

      border-color:
        rgba(220, 232, 242, 0.72);

      box-shadow:
        0 0 30px rgba(170, 205, 235, 0.1);

      transform: translateY(-1px);
    }

    #beginBtn:active {
      transform: translateY(0);
    }


    /* ============================================================
       04 — MINIMAL HUD
       ============================================================ */

    #hud {
      position: fixed;
      inset: 0;

      z-index: 40;

      pointer-events: none;
    }

    #zoneLabel {
      position: absolute;

      left: 50%;
      bottom: 6%;

      transform:
        translateX(-50%)
        translateY(8px);

      width: max-content;
      max-width: 80vw;

      color: rgba(220, 232, 242, 0.82);

      font-size: 0.7rem;

      letter-spacing: 0.35em;

      text-align: center;

      text-transform: uppercase;

      opacity: 0;

      text-shadow:
        0 0 12px rgba(0, 0, 0, 0.9),
        0 0 28px rgba(0, 0, 0, 0.6);

      transition:
        opacity 2.2s ease,
        transform 2.2s ease;
    }

    #zoneLabel.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    #reticle {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 4px;
      height: 4px;

      margin:
        -2px 0 0 -2px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.35);

      opacity: 0;

      transition: opacity 0.5s ease;
    }

    #reticle.active {
      opacity: 1;
    }


    /* ============================================================
       05 — MOBILE JOYSTICK
       ============================================================ */

    #joyBase {
      position: fixed;

      left: 26px;
      bottom: 26px;

      z-index: 45;

      display: none;

      width: 108px;
      height: 108px;

      border:
        1px solid
        rgba(220, 232, 242, 0.23);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(220, 232, 242, 0.055),
          rgba(220, 232, 242, 0.018)
        );

      box-shadow:
        inset 0 0 25px rgba(220, 232, 242, 0.025),
        0 8px 30px rgba(0, 0, 0, 0.25);

      touch-action: none;
    }

    #joyBase::before {
      content: "";

      position: absolute;

      inset: 12px;

      border:
        1px solid
        rgba(220, 232, 242, 0.07);

      border-radius: 50%;
    }

    #joyStick {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 40px;
      height: 40px;

      margin:
        -20px 0 0 -20px;

      border:
        1px solid
        rgba(220, 232, 242, 0.3);

      border-radius: 50%;

      background:
        rgba(220, 232, 242, 0.25);

      box-shadow:
        0 0 20px rgba(170, 210, 245, 0.08);

      pointer-events: none;

      transform: translate(0, 0);

      transition:
        transform 0.08s linear;
    }

    #lookPad {
      position: fixed;

      right: 0;
      top: 0;

      z-index: 44;

      display: none;

      width: 55%;
      height: 100%;

      touch-action: none;
    }


    /* ============================================================
       06 — CINEMATIC POST-PROCESS OVERLAYS
       ============================================================ */

    #vignette {
      position: fixed;
      inset: 0;

      z-index: 30;

      pointer-events: none;

      box-shadow:
        inset 0 0 18vw 4vw
        rgba(0, 0, 0, 0.58);

      mix-blend-mode: multiply;
    }

    #vignette::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.18) 72%,
          rgba(0, 0, 0, 0.42) 100%
        );
    }

    #grade {
      position: fixed;
      inset: 0;

      z-index: 29;

      pointer-events: none;

      background:
        rgba(120, 150, 190, 0.05);

      mix-blend-mode: soft-light;

      transition:
        background 3s ease;
    }

    #grain {
      position: fixed;
      inset: 0;

      z-index: 31;

      pointer-events: none;

      opacity: 0.045;

      mix-blend-mode: overlay;

      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='noise'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23noise)'/></svg>");

      background-size: 180px 180px;

      animation:
        grainShift 0.25s steps(2) infinite;
    }

    @keyframes grainShift {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(-1%, 1%);
      }

      50% {
        transform: translate(1%, -1%);
      }

      75% {
        transform: translate(1%, 1%);
      }

      100% {
        transform: translate(-1%, -1%);
      }
    }

    #fadeBlack {
      position: fixed;
      inset: 0;

      z-index: 80;

      background: #000;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 3.5s ease;
    }


    /* ============================================================
       07 — CINEMATIC LETTER
       ============================================================ */

    #letterLayer {
      position: fixed;
      inset: 0;

      z-index: 60;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 5vh 4vw;

      opacity: 0;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(12, 9, 6, 0.12),
          rgba(0, 0, 0, 0.48)
        );

      transition:
        opacity 2.5s ease;
    }

    #letterLayer.visible {
      opacity: 1;
    }

    #letterBox {
      position: relative;

      width: min(88vw, 620px);
      max-height: 84vh;

      overflow-y: auto;

      padding: 2.5rem 2rem;

      color: #f3e6c8;

      direction: rtl;

      font-family:
        "Traditional Arabic",
        "Amiri",
        "Noto Naskh Arabic",
        Arial,
        sans-serif;

      font-size: clamp(1rem, 2.8vw, 1.18rem);

      line-height: 2.15;

      text-align: center;

      text-shadow:
        0 0 18px rgba(0, 0, 0, 0.95);

      scrollbar-width: none;
    }

    #letterBox::-webkit-scrollbar {
      display: none;
    }

    #letterBox::before {
      content: "";

      position: absolute;

      top: 0;
      left: 50%;

      width: 1px;
      height: 70px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(217, 199, 154, 0.4),
          transparent
        );

      transform: translateX(-50%);
    }

    #letterBox p {
      margin: 0 0 1.15em;

      opacity: 0;

      transform:
        translateY(10px);

      transition:
        opacity 1.8s ease,
        transform 1.8s ease;
    }

    #letterBox p.show {
      opacity: 1;

      transform:
        translateY(0);
    }

    #letterBox .sign {
      margin-top: 1.8em;

      color: #d9c79a;

      direction: ltr;

      font-size: 1rem;

      text-align: center;
    }


    /* ============================================================
       08 — FINAL TITLE CARD
       ============================================================ */

    #finalCard {
      position: fixed;
      inset: 0;

      z-index: 81;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 2rem;

      color: var(--frost);

      text-align: center;

      opacity: 0;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(12, 17, 24, 0.35),
          rgba(0, 0, 0, 0.98)
        );

      transition:
        opacity 3s ease;
    }

    #finalCard.visible {
      opacity: 1;

      pointer-events: auto;
    }

    #finalCard h1 {
      margin: 0;

      font-size: clamp(2.3rem, 8vw, 4.2rem);

      font-weight: 300;

      letter-spacing: 0.4em;

      text-indent: 0.4em;

      text-transform: uppercase;

      text-shadow:
        0 0 30px rgba(200, 220, 245, 0.18);
    }

    #finalCard h2 {
      margin: 0.8rem 0 0;

      color: #d9c79a;

      font-size: clamp(0.8rem, 2.5vw, 1rem);

      font-weight: 300;

      letter-spacing: 0.35em;

      text-indent: 0.35em;

      text-transform: uppercase;
    }

    #finalCard h3 {
      margin: 1.6rem 0 0;

      color: #8296ac;

      font-size: 0.8rem;

      font-weight: 300;

      letter-spacing: 0.25em;

      text-indent: 0.25em;
    }


    /* ============================================================
       09 — SETTINGS
       ============================================================ */

    #settingsBtn {
      position: fixed;

      top: 16px;
      right: 16px;

      z-index: 50;

      display: flex;

      align-items: center;
      justify-content: center;

      width: 34px;
      height: 34px;

      border:
        1px solid
        rgba(220, 232, 242, 0.22);

      border-radius: 50%;

      color: #dce8f2;

      background:
        rgba(6, 10, 16, 0.42);

      font-family: Arial, sans-serif;

      font-size: 0.85rem;

      cursor: pointer;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
    }

    #settingsBtn:hover {
      background:
        rgba(220, 232, 242, 0.1);

      border-color:
        rgba(220, 232, 242, 0.45);

      transform: rotate(20deg);
    }

    #settingsPanel {
      position: fixed;

      top: 58px;
      right: 16px;

      z-index: 50;

      display: none;

      min-width: 170px;

      padding: 0.9rem 1rem;

      color: #dce8f2;

      border:
        1px solid
        rgba(220, 232, 242, 0.18);

      background:
        rgba(4, 8, 14, 0.82);

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      font-family:
        Arial,
        sans-serif;

      font-size: 0.7rem;

      letter-spacing: 0.08em;
    }

    #settingsPanel.visible {
      display: block;
    }

    #settingsPanel label {
      display: block;

      margin: 0.55rem 0;

      cursor: pointer;
    }

    #settingsPanel label:first-child {
      margin-top: 0;
    }

    #settingsPanel select {
      width: 100%;

      margin-top: 0.45rem;

      padding: 0.3rem 0.35rem;

      color: #dce8f2;

      border:
        1px solid
        rgba(220, 232, 242, 0.25);

      background: #0c1219;

      outline: none;

      cursor: pointer;
    }

    #settingsPanel input {
      accent-color: #a8bed4;
    }


    /* ============================================================
       10 — RESPONSIVE LAYOUT
       ============================================================ */

    @media (max-width: 820px) {
      #joyBase,
      #lookPad {
        display: block;
      }

      #settingsBtn {
        top: 12px;
        right: 12px;
      }

      #settingsPanel {
        top: 54px;
        right: 12px;
      }

      #loading h1 {
        font-size: 1.75rem;
      }

      #loading h2 {
        font-size: 0.62rem;

        letter-spacing: 0.35em;
      }

      #startOverlay .card {
        padding:
          1.7rem
          1.35rem;
      }

      #letterBox {
        padding:
          2rem
          1rem;
      }

      #letterBox p {
        margin-bottom: 1em;
      }
    }

    @media (max-height: 620px) {
      #startOverlay .card {
        padding:
          1.25rem
          1.5rem;
      }

      #startOverlay p {
        font-size: 0.68rem;
      }

      #beginBtn {
        margin-top: 1rem;
      }

      #letterBox {
        max-height: 88vh;
      }
    }


    /* ============================================================
       11 — ACCESSIBILITY / MOTION
       ============================================================ */

    @media (prefers-reduced-motion: reduce) {
      #grain {
        animation: none;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>


<body>

  <!-- ============================================================
       APPLICATION ROOT
       ============================================================ -->

  <div id="app"></div>


  <!-- ============================================================
       LOADING SCREEN
       ============================================================ -->

  <section id="loading" aria-label="Loading">
    <div id="loadingContent">

      <h1>Randy</h1>

      <h2>The Frozen Journey</h2>

      <div id="loadingSubtitle">
        A cinematic winter experience
      </div>

      <div id="loadbar">
        <div id="loadfill"></div>
      </div>

      <div id="loadtext">
        Loading — 0%
      </div>

      <div id="loaderror"></div>

    </div>
  </section>


  <!-- ============================================================
       START SCREEN
       ============================================================ -->

  <section id="startOverlay" aria-label="Start experience">

    <div class="card">

      <h3>
        Randy — The Frozen Journey
      </h3>

      <p>
        Walk with W A S D · look by dragging the screen
      </p>

      <p>
        On phone: left thumb to walk, right side to look
      </p>

      <p class="warning">
        Headphones recommended.
      </p>

      <button
        id="beginBtn"
        type="button"
      >
        Begin the walk
      </button>

    </div>

  </section>


  <!-- ============================================================
       MINIMAL HUD
       ============================================================ -->

  <div id="hud">

    <div id="zoneLabel"></div>

    <div id="reticle"></div>

  </div>


  <!-- ============================================================
       MOBILE CONTROLS
       ============================================================ -->

  <div
    id="joyBase"
    aria-hidden="true"
  >
    <div id="joyStick"></div>
  </div>

  <div
    id="lookPad"
    aria-hidden="true"
  ></div>


  <!-- ============================================================
       CINEMATIC OVERLAYS
       ============================================================ -->

  <div id="grade"></div>

  <div id="vignette"></div>

  <div id="grain"></div>


  <!-- ============================================================
       FINAL LETTER LAYER
       ============================================================ -->

  <section
    id="letterLayer"
    aria-hidden="true"
  >
    <div id="letterBox"></div>
  </section>


  <!-- ============================================================
       FINAL BLACK TRANSITION
       ============================================================ -->

  <div id="fadeBlack"></div>


  <!-- ============================================================
       FINAL TITLE CARD
       ============================================================ -->

  <section
    id="finalCard"
    aria-hidden="true"
  >

    <h1>Randy</h1>

    <h2>Happy Birthday</h2>

    <h3>— Noor</h3>

  </section>


  <!-- ============================================================
       SETTINGS
       ============================================================ -->

  <button
    id="settingsBtn"
    type="button"
    aria-label="Open settings"
  >
    ⚙
  </button>

  <div id="settingsPanel">

      /* ==========================================================

      /* ==========================================================

      function fatal(message) {

            message;
        }

        if (DOM.loadText) {

        }
      }


      function checkEnvironment() {

        if (
          !window.WebGLRenderingContext
        ) {

          fatal(
            "This browser does not support WebGL. Please use a modern browser such as Chrome, Firefox, Safari or Edge."
          );

          return false;
        }


        if (
          typeof THREE === "undefined"
        ) {

          fatal(
            "The 3D engine could not be loaded. Please check your internet connection and reload the experience."
          );

        }


        return true;

      /* ==========================================================
         10 — LOADING SYSTEM
         ========================================================== */

      function setLoad(
        percentage,
        label
      ) {

        const pct =
          Math.max(
            0,
            Math.min(
              100,
              percentage
            )
          );

        DOM.loadFill.style.width =
          `${pct}%`;

        DOM.loadText.textContent =
          `${label} — ${Math.round(pct)}%`;
      }


      function nextFrame() {

        return new Promise(
          resolve => {

            requestAnimationFrame(
              () => {

                  resolve
                );

              }
            );

          }
        );
      }


      /* ==========================================================
         11 — PROCEDURAL NOISE GENERATOR
         ========================================================== */

      const NoiseGen = (() => {

        const permutation =
          new Uint8Array(512);

        const base =
          new Uint8Array(256);


        for (
          let i = 0;
          i < 256;
          i++
        ) {

          base[i] = i;
        }


        let seed = 1337;


        function random() {

          seed =
            (
              seed * 1664525 +
              1013904223
            ) >>> 0;

          return (
            seed /
            4294967296
          );
        }


        for (
          let i = 255;
          i > 0;
          i--
        ) {

          const j =
            Math.floor(
              random() *
              (i + 1)
            );

          const temp =
            base[i];

          base[i] =
            base[j];

          base[j] =
            temp;
        }


        for (
          let i = 0;
          i < 512;
          i++
        ) {

          permutation[i] =
            base[i & 255];
        }


        function fade(t) {

          return (
            t *
            t *
            t *
            (
              t *
              (t * 6 - 15) +
              10
            )
          );
        }


        function lerp(
          a,
          b,
          t
        ) {

          return (
            a +
            t * (b - a)
          );
        }


        function gradient(
          hash,
          x,
          y
        ) {

          const h =
            hash & 3;

          const u =
            h < 2
              ? x
              : y;

          const v =
            h < 2
              ? y
              : x;

          return (
            ((h & 1)
              ? -u
              : u) +
            ((h & 2)
              ? -2 * v
              : 2 * v)
          );
        }


        function noise2(
          x,
          y
        ) {

          const X =
            Math.floor(x) & 255;

          const Y =
            Math.floor(y) & 255;


          x -= Math.floor(x);

          y -= Math.floor(y);


          const u =
            fade(x);

          const v =
            fade(y);


          const aa =
            permutation[
              X +
              permutation[Y]
            ];

          const ab =
            permutation[
              X +
              permutation[Y + 1]
            ];

          const ba =
            permutation[
              X + 1 +
              permutation[Y]
            ];

          const bb =
            permutation[
              X + 1 +
              permutation[Y + 1]
            ];


          return lerp(

            lerp(
              gradient(
                aa,
                x,
                y
              ),

              gradient(
                ba,
                x - 1,
                y
              ),

              u
            ),

            lerp(
              gradient(
                ab,
                x,
                y - 1
              ),

              gradient(
                bb,
                x - 1,
                y - 1
              ),

              u
            ),

            v

          );
        }


        function fbm(
          x,
          y,
          octaves = 4
        ) {

          let total = 0;

          let amplitude = 1;

          let frequency = 1;

          let maxAmplitude = 0;


          for (
            let i = 0;
            i < octaves;
            i++
          ) {

            total +=
              noise2(
                x * frequency,
                y * frequency
              ) *
              amplitude;


            maxAmplitude +=
              amplitude;


            amplitude *= 0.5;

            frequency *= 2.05;
          }


          return (
            total /
            maxAmplitude
          );
        }


        return {
          noise2,
          fbm
        };

      })();

      const CASTLE_DOOR_Z =

      const CASTLE_GATE_Z =

      /* ==========================================================
         13 — ZONE LOOKUP
         ========================================================== */

      function zoneAt(progress) {

        for (
          const zone of ZONES
        ) {

          if (
            progress >= zone.start &&
            progress < zone.end
          ) {

            return zone;
          }
        }


        return (
          ZONES[
            ZONES.length - 1
          ]
        );
      }


      /* ==========================================================
         14 — TERRAIN HEIGHT FUNCTION
         ========================================================== */

      function terrainHeight(
        x,
        z
      ) {

        const progress =
          -z;


        let height =
          NoiseGen.fbm(
            x * 0.02,
            z * 0.02,
            4
          ) * 3.2;


        height +=
          NoiseGen.fbm(
            x * 0.006,
            z * 0.006,
            2
          ) * 6;


        /*
         * Mountain elevation.
         */

        if (
          progress > 560
        ) {

          height +=
            Math.min(
              (progress - 560) / 200,
              1
            ) * 14;
        }


        /*
         * Frozen river depression.
         */

        if (
          progress > 330 &&
          progress < 430
        ) {

          const riverFactor =
            1 -
            Math.min(
              Math.abs(
                progress - 380
              ) / 40,
              1
            );


          height -=
            riverFactor * 3.2;
        }


        /*
         * Flatten the central walking path.
         */

        const distanceFromPath =
          Math.abs(x);


        const flatten =
          THREE.MathUtils.clamp(
            1 -
            distanceFromPath / 5,
            0,
            1
          );


        height =
          THREE.MathUtils.lerp(
            height,
            height * 0.25,
            flatten * 0.7
          );


        return height;
      }


      /* ==========================================================
         15 — CORE THREE.JS INITIALIZATION
         ========================================================== */

      function initCore() {

        renderer =
          new THREE.WebGLRenderer({

            antialias:
              APP.renderer.antialias,

            powerPreference:
              APP.renderer.powerPreference
          });


        renderer.setPixelRatio(
          quality.pixelRatio

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );


        renderer.outputEncoding =
          THREE.sRGBEncoding;


        renderer.toneMapping =
          THREE.ACESFilmicToneMapping;


        renderer.toneMappingExposure =
          1.05;


        if (
          quality.shadow

          renderer.shadowMap.enabled =
            true;

          renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;
        }

          renderer.domElement

         * Main scene.

          new THREE.Scene();


        scene.background =

        scene.fog =
          new THREE.FogExp2(
            0xaebfce,
            0.012
          );


        /*
         * Cinematic camera.
         */

        camera =
          new THREE.PerspectiveCamera(

            APP.camera.fov,

            window.innerWidth /
            window.innerHeight,

            APP.camera.near,

            APP.camera.far
          );


        camera.position.set(
          0,
          2,
          8
        );


        clock =
          new THREE.Clock();


        /*
         * World containers.
         */

        exteriorGroup =
          new THREE.Group();


        exteriorGroup.name =
          "EXTERIOR_WORLD";


        scene.add(
          exteriorGroup
        );


        interiorGroup =
          new THREE.Group();


        interiorGroup.name =
          "CASTLE_INTERIOR";


        interiorGroup.visible =
          false;


        scene.add(
          interiorGroup
        );


        /*
         * Resize handling.
         */

        window.addEventListener(
          "resize",
          onResize,
          {
            passive: true
          }
        );


        STATE.initialized =
          true;
      }


      /* ==========================================================
         16 — RESIZE
         ========================================================== */

      function onResize() {

        if (
          !renderer ||
          !camera
        ) {

          return;
        }


        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );


        renderer.setPixelRatio(
          quality.pixelRatio
        );
      }


      /* ==========================================================
         17 — TERRAIN BUILDER
         ========================================================== */

      function buildTerrain() {

        const width = 140;

        const segmentsX = 90;

        const segmentsZ = 240;


        const geometry =
          new THREE.PlaneGeometry(

            width,

            PATH_LENGTH + 60,

            segmentsX,

            segmentsZ
          );


        geometry.rotateX(
          -Math.PI / 2
        );


        const position =
          geometry.attributes.position;


        const colors =
          new Float32Array(
            position.count * 3
          );


        const snowColor =
          new THREE.Color(
            0xf2f6fb
          );


        const rockColor =
          new THREE.Color(
            0x5c6270
          );


        const iceColor =
          new THREE.Color(
            0xbfd6e6
          );


        /*
         * Sculpt the terrain vertices.
         */

        for (
          let i = 0;
          i < position.count;
          i++
        ) {

          const x =
            position.getX(i);


          /*
           * PlaneGeometry is centered
           * around zero. Convert its local
           * Z into journey coordinates.
           */

          const worldZ =
            position.getZ(i) -
            (
              PATH_LENGTH / 2 -
              30
            );


          const height =
            terrainHeight(
              x,
              worldZ
            );


          position.setY(
            i,
            height
          );


          /*
           * Approximate terrain material
           * variation from procedural noise.
           */

          const slope =
            Math.abs(
              NoiseGen.fbm(
                x * 0.05,
                worldZ * 0.05,
                2
              )
            );


          const color =
            new THREE.Color();


          if (
            slope > 0.35
          ) {

            color
              .copy(rockColor)
              .lerp(
                snowColor,
                1 - slope
              );

          } else {

            color
              .copy(snowColor)
              .lerp(
                iceColor,
                Math.max(
                  0,
                  0.3 - slope
                )
              );
          }


          /*
           * Subtle natural variation.
           */

          color.multiplyScalar(
            0.9 +
            Math.random() * 0.12
          );


          colors[i * 3] =
            color.r;

          colors[i * 3 + 1] =
            color.g;

          colors[i * 3 + 2] =
            color.b;
        }


        geometry.setAttribute(
          "color",
          new THREE.BufferAttribute(
            colors,
            3
          )
        );


        /*
         * Move the terrain so the path
         * begins near world Z = 0.
         */

        geometry.translate(
          0,
          0,
          -(
            PATH_LENGTH / 2 -
            30
          )
        );


        geometry.computeVertexNormals();


        const material =
          new THREE.MeshStandardMaterial({

            vertexColors:
              true,

            roughness:
              0.92,

            metalness:
              0.02,

            flatShading:
              false
          });


        const terrain =
          new THREE.Mesh(
            geometry,
            material
          );


        terrain.name =
          "PROCEDURAL_SNOW_TERRAIN";


        terrain.receiveShadow =
          true;


        exteriorGroup.add(
          terrain
        );


        world = {
          terrain,
          width,
          pathLength:
            PATH_LENGTH
        };


        return terrain;
      }


      /* ==========================================================
         18 — BASE WORLD API
         ========================================================== */

      const WorldAPI = {

        getTerrainHeight(x, z) {

          return terrainHeight(
            x,
            z
          );
        },


        getProgress() {

          return Math.max(
            0,
            Math.min(
              PATH_LENGTH,
              -playerPosition.z
            )
          );
        },


        getZone() {

          return zoneAt(
            this.getProgress()
          );
        }
      };


      /* ==========================================================
         19 — DIRECTOR FOUNDATION
         ========================================================== */

      pathDirector = {

        progress: 0,

        zone: ZONES[0],

        update(progress) {

          this.progress =
            progress;

          this.zone =
            zoneAt(
              progress
            );

          return this.zone;
        }
      };

         20 — INITIAL PLAYER POSITION
         ========================================================== */

      function resetPlayerPosition() {

        playerPosition.set(
          0,
          terrainHeight(
            0,
            5
          ),

        );
      }

         21 — PREPARATION FOR PART 2 / 3
         ========================================================== */

      let castleWindows = [];

      let candleLights = [];

      let finalRoomTrigger = null;

      let sun = null;

      let hemi = null;

      let moonFill = null;

         22 — PART 1 COMPLETE

       * buildRuins()
       * buildCastle()
       * buildInterior()

       *
       * PART 3 attaches:

       * updatePlayerInterior()

       *

       */

      window.RANDY_ENGINE = {

        APP,

        DOM,

        STATE,

        QUALITY,

        ZONES,

        INPUT,

        PLAYER,

        CAMERA_RIG,

        NoiseGen,

        WorldAPI,

        terrainHeight,

        zoneAt,

        initCore,

        buildTerrain,

        setLoad,

        nextFrame,

        resetPlayerPosition,

        refs: {

          get renderer() {
            return renderer;
          },

            return scene;
          },

            return camera;
          },

          },

          },

          },

      };


      /*
