<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة التسجيل</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #202124;
    }
    .container {
        max-width: 650px;
        margin: 30px auto;
        padding: 15px;
    }
    .header {
        background: white;
        border-radius: 10px;
        padding: 25px;
        border-top: 8px solid #673ab7;
        box-shadow: 0 2px 8px #ddd;
        margin-bottom: 15px;
    }
    .header h1 {
        margin-top: 0;
        font-size: 28px;
    }
    .question {
        background: white;
        padding: 22px;
        margin-bottom: 12px;
        border-radius: 10px;
        box-shadow: 0 1px 5px #ddd;
    }
    label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
    }
    input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        border: 1px solid #aaa;
        border-radius: 5px;
        font-size: 16px;
        outline: none;
    }
    input:focus, select:focus {
        border: 2px solid #673ab7;
    }
    .options label {
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        cursor: pointer;
    }
    .options input {
        width: auto;
    }
    button {
        width: 100%;
        padding: 15px;
        background: #673ab7;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
    }
    button:hover {
        background: #512da8;
    }
    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    .required {
        color: red;
    }
    #success {
        display: none;
        background: #e8f5e9;
        color: #2e7d32;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        margin-top: 15px;
        font-size: 18px;
    }
    #error {
        display: none;
        background: #ffebee;
        color: #c62828;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        margin-top: 15px;
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>استمارة التسجيل</h1>
        <p>يرجى ملء المعلومات التالية لإتمام التسجيل.</p>
        <small>
            <span class="required">*</span> السؤال مطلوب
        </small>
    </div>

    <form
        id="registrationForm"
        action="https://formsubmit.co/nwrrswljasm@gmail.com"
        method="POST">

        <input type="hidden" name="_subject" value="🎉 تسجيل جديد للحفل">
        <input type="hidden" name="_template" value="table">

        <div class="question">
            <label>
                الاسم الثلاثي بالعربي
                <span class="required">*</span>
            </label>
            <input
                type="text"
                name="full_name"
                placeholder="اكتب اسمك الثلاثي بالعربي"
                maxlength="100"
                required>
        </div>

        <div class="question">
            <label>
                العمر
                <span class="required">*</span>
            </label>
            <input
                type="number"
                name="age"
                placeholder="اكتب عمرك"
                min="1"
                max="120"
                required>
        </div>

        <div class="question">
            <label>
                معرف التليجرام
                <span class="required">*</span>
            </label>
            <input
                type="text"
                name="telegram"
                placeholder="@username"
                maxlength="100"
                required>
        </div>

        <div class="question">
            <label>
                رقم حساب واتساب
                <span class="required">*</span>
            </label>
            <input
                type="tel"
                name="whatsapp"
                placeholder="07xxxxxxxxx"
                maxlength="30"
                required>
        </div>

        <div class="question">
            <label>
                من أين سمعت عن الحفل؟
                <span class="required">*</span>
            </label>

            <select name="source" required>
                <option value="">اختر إجابة</option>
                <option value="التليجرام">التليجرام</option>
                <option value="الواتساب">الواتساب</option>
                <option value="الإنستغرام">الإنستغرام</option>
                <option value="صديق أو شخص أعرفه">
                    صديق أو شخص أعرفه
                </option>
                <option value="من إعلان">من إعلان</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>

        <div class="question">
            <label>
                هل أنت متأكد من حضورك؟
                <span class="required">*</span>
            </label>

            <div class="options">

                <label>
                    <input
                        type="radio"
                        name="attendance"
                        value="نعم"
                        required>
                    نعم
                </label>

                <label>
                    <input
                        type="radio"
                        name="attendance"
                        value="لا">
                    لا
                </label>

                <label>
                    <input
                        type="radio"
                        name="attendance"
                        value="ربما">
                    ربما
                </label>

            </div>
        </div>

        <button type="submit" id="submitButton">
            إرسال
        </button>

    </form>

    <div id="success">
        ✅ تم إرسال الاستمارة بنجاح!
    </div>

    <div id="error">
        ❌ حدث خطأ أثناء الإرسال. حاول مرة أخرى.
    </div>

</div>

<script>
const form = document.getElementById("registrationForm");
const button = document.getElementById("submitButton");
const success = document.getElementById("success");
const error = document.getElementById("error");

form.addEventListener("submit", function(e) {

    button.disabled = true;
    button.textContent = "جارٍ الإرسال...";
    error.style.display = "none";

});
</script>

</body>
</html>
